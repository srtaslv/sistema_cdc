
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio | Cabana da Carol</title>
    <link rel="stylesheet" href="{% static 'css/cardapio.css' %}">
</head>
<body>

    <header class="cabecalho">
        <a href="/" class="logo">🌴 Cabana da Carol</a>
        <a href="/" class="voltar">← Voltar ao início</a>
    </header>

    <main>
        <section class="introducao">
            <p class="subtitulo">SABORES À BEIRA-MAR</p>
            <h1>Nosso Cardápio</h1>
            <p>Escolha seus favoritos e aproveite cada sabor!</p>
        </section>

        <nav class="abas">
            <button class="aba ativa" data-tipo="comidas">🍽️ Comidas</button>
            <button class="aba" data-tipo="bebidas">🍹 Bebidas</button>
        </nav>

        <nav class="categorias" id="categorias">
            <button class="categoria ativa" data-categoria="todas">
                Todas
            </button>
        </nav>

        <section class="produtos" id="produtos">
            <p>Os produtos do cardápio serão exibidos aqui.</p>
        </section>
    </main>

    <footer>
        <p>Cabana da Carol· Sabores que combinam com o mar</p>
    </footer>

</body>
</html>
